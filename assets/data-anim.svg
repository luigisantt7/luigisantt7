<svg xmlns="http://www.w3.org/2000/svg" width="320" height="250" viewBox="0 0 320 250" font-family="JetBrains Mono, Consolas, monospace">
  <rect x="0.5" y="0.5" width="319" height="249" rx="10" fill="#0d1117" stroke="#30363d"/>
  <circle cx="18" cy="16" r="4.5" fill="#ff5f56"/>
  <circle cx="33" cy="16" r="4.5" fill="#ffbd2e"/>
  <circle cx="48" cy="16" r="4.5" fill="#27c93f"/>
  <text x="160" y="20" fill="#8b949e" font-size="10" text-anchor="middle">analysis.py</text>
  <line x1="0" y1="30" x2="320" y2="30" stroke="#30363d"/>

  <text x="16" y="50" fill="#7ee787" font-size="11">$ <tspan fill="#e6edf3">python analysis.py</tspan></text>
  <text x="16" y="68" fill="#8b949e" font-size="10" opacity="0">&gt; loading data... ok
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.15;0.95;1" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="16" y="83" fill="#8b949e" font-size="10" opacity="0">&gt; training model... <tspan fill="#7ee787">done</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.25;0.95;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- axis -->
  <line x1="30" y1="220" x2="300" y2="220" stroke="#30363d"/>
  <line x1="30" y1="105" x2="30" y2="220" stroke="#30363d"/>

  <!-- bars -->
  <g fill="#1f6feb">
    <rect x="45" width="26" y="220" height="0" rx="3"><animate attributeName="height" values="0;0;40;40;0" keyTimes="0;0.3;0.42;0.95;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="220;220;180;180;220" keyTimes="0;0.3;0.42;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="85" width="26" y="220" height="0" rx="3"><animate attributeName="height" values="0;0;62;62;0" keyTimes="0;0.34;0.46;0.95;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="220;220;158;158;220" keyTimes="0;0.34;0.46;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="125" width="26" y="220" height="0" rx="3"><animate attributeName="height" values="0;0;50;50;0" keyTimes="0;0.38;0.5;0.95;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="220;220;170;170;220" keyTimes="0;0.38;0.5;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="165" width="26" y="220" height="0" rx="3"><animate attributeName="height" values="0;0;78;78;0" keyTimes="0;0.42;0.54;0.95;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="220;220;142;142;220" keyTimes="0;0.42;0.54;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="205" width="26" y="220" height="0" rx="3"><animate attributeName="height" values="0;0;70;70;0" keyTimes="0;0.46;0.58;0.95;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="220;220;150;150;220" keyTimes="0;0.46;0.58;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="245" width="26" y="220" height="0" rx="3" fill="#a371f7"><animate attributeName="height" values="0;0;100;100;0" keyTimes="0;0.5;0.62;0.95;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="220;220;120;120;220" keyTimes="0;0.5;0.62;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
  </g>

  <!-- trend line -->
  <polyline points="58,172 98,150 138,160 178,132 218,140 258,108" fill="none" stroke="#7ee787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="260" stroke-dashoffset="260">
    <animate attributeName="stroke-dashoffset" values="260;260;0;0;260" keyTimes="0;0.62;0.8;0.95;1" dur="6s" repeatCount="indefinite"/>
  </polyline>
  <text x="258" y="100" fill="#7ee787" font-size="10" text-anchor="middle" opacity="0">+38%
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.84;0.95;1" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>
